services:
  - type: web
    name: drdo-canteen-api
    runtime: docker
    dockerfilePath: Dockerfile.api
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: 5000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: drdo-canteen-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: drdo-canteen-db
    databaseName: drdo_canteen
    user: drdo_admin
    plan: free
    region: oregon
