name: DRDO Enterprise Canteen CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Test & Build (.NET 9.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore CanteenManagement.sln

      - name: Build Solution
        run: dotnet build CanteenManagement.sln --no-restore -c Release

      - name: Run xUnit Unit & Concurrency Tests
        run: dotnet test tests/Canteen.UnitTests/Canteen.UnitTests.csproj --no-build -c Release --verbosity normal

  frontend-check:
    name: Frontend Lint & Build (React 19 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Compile Production Bundle
        run: npm run build

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: drdo-canteen-api:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          push: false
          tags: drdo-canteen-ui:ci
